<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t">
<title id="t">yumm-lab: a smiling lab flask bubbling next to the word yumm</title>
<style>
/* Hallmark · genre: playful · macrostructure: none (GitHub README banner) · theme: Hum · tone: playful · enrichment: Tier B hand-built SVG
 * Hallmark · pre-emit critique: P4 H5 E4 S5 R4 V4 */
svg {
  --color-panel: oklch(86% 0.18 95);
  --color-word: oklch(20% 0.012 250);
  --color-line: oklch(20% 0.012 250);
  --color-flask: oklch(97% 0.012 95);
  --color-accent-2: oklch(66% 0.18 235);
  --color-pop: oklch(68% 0.24 18);
  --color-face: oklch(20% 0.012 250);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --stroke-word: 30px;
  --stroke-line: 14px;
}
.panel { fill: var(--color-panel); }
.word { fill: none; stroke: var(--color-word); stroke-width: var(--stroke-word); stroke-linecap: round; stroke-linejoin: round; }
.dash { fill: none; stroke: var(--color-pop); stroke-width: var(--stroke-word); stroke-linecap: round; }
.glass { fill: var(--color-flask); }
.line { fill: none; stroke: var(--color-line); stroke-width: var(--stroke-line); stroke-linecap: round; stroke-linejoin: round; }
.liquid { fill: var(--color-accent-2); animation: slosh 3.2s linear infinite; }
.eye { fill: var(--color-face); transform-box: fill-box; transform-origin: center; animation: blink 5s var(--ease-in-out) infinite; }
.smile { fill: none; stroke: var(--color-face); stroke-width: 7px; stroke-linecap: round; }
.cheek { fill: var(--color-pop); opacity: 0.55; }
.spark-pop { fill: var(--color-pop); }
.spark-cool { fill: var(--color-accent-2); }
.bubble { animation: rise 2.7s var(--ease-in-out) infinite; }
.b1 { fill: var(--color-pop); animation-delay: -0.2s; }
.b2 { fill: var(--color-accent-2); animation-delay: -1.1s; }
.b3 { fill: var(--color-pop); animation-delay: -2s; }
@keyframes slosh { to { transform: translateX(-120px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
@keyframes rise {
  0% { transform: translateY(0); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-100px); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .liquid, .eye, .bubble { animation: none; } }
</style>
